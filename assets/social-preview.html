<!doctype html>
<!--
  Source for assets/social-preview.png — GitHub's social preview image (1280×640).
  Re-render after editing:
    <browser> --headless --disable-gpu --window-size=1280,640 \
      --screenshot=assets/social-preview.png assets/social-preview.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    background:
      radial-gradient(620px 520px at 14% 42%, rgba(240,185,74,0.13), transparent 70%),
      linear-gradient(150deg, #343841 0%, #292c33 45%, #202329 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #efece4;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
  }

  /* Usage bars echoing the icon, receding into the bottom-right corner */
  .motif { position: absolute; right: 0; bottom: 0; opacity: 0.06; }

  .head { display: flex; align-items: center; gap: 40px; }
  .mark { flex: none; filter: drop-shadow(0 10px 22px rgba(0,0,0,0.45)); }

  h1 {
    font-size: 86px; font-weight: 700; letter-spacing: -2.5px; line-height: 1;
  }
  .tag {
    margin-top: 16px; font-size: 27px; font-weight: 400;
    color: #a8a294; letter-spacing: -0.2px;
  }

  .chips { display: flex; gap: 16px; margin: 46px 0 0 208px; }
  .chip {
    padding: 11px 22px; border-radius: 999px;
    background: rgba(240,185,74,0.12);
    border: 1px solid rgba(240,185,74,0.30);
    color: #f0b94a; font-size: 22px; font-weight: 600; letter-spacing: -0.2px;
    white-space: nowrap;
  }

  .foot {
    position: absolute; left: 96px; bottom: 46px;
    font-size: 20px; color: #757168; letter-spacing: 0.2px;
  }
</style>
</head>
<body>

  <svg class="motif" width="440" height="300" viewBox="0 0 440 300" fill="#f0b94a">
    <rect x="0"   y="190" width="70" height="110" rx="14"/>
    <rect x="94"  y="130" width="70" height="170" rx="14"/>
    <rect x="188" y="70"  width="70" height="230" rx="14"/>
    <rect x="282" y="20"  width="70" height="280" rx="14"/>
  </svg>

  <div class="head">
    <svg class="mark" width="168" height="168" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="0.55" y2="1">
          <stop offset="0" stop-color="#3a3f49"/>
          <stop offset="0.55" stop-color="#2e323a"/>
          <stop offset="1" stop-color="#24272d"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0.7" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
        </linearGradient>
        <linearGradient id="amber" x1="0.15" y1="0" x2="0.85" y2="1">
          <stop offset="0" stop-color="#f5c86c"/>
          <stop offset="0.5" stop-color="#f0b94a"/>
          <stop offset="1" stop-color="#dca22a"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#tile)"/>
      <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>
      <g fill="url(#amber)">
        <rect x="155" y="232" width="38" height="54"  rx="10"/>
        <rect x="205" y="194" width="38" height="92"  rx="10"/>
        <rect x="255" y="150" width="38" height="136" rx="10"/>
      </g>
      <g fill="none" stroke="url(#amber)" stroke-width="42" stroke-linecap="round">
        <circle cx="224" cy="216" r="128"/>
        <path d="M317 309 L400 392" stroke-width="51"/>
      </g>
    </svg>

    <div>
      <h1>AI Insights</h1>
      <div class="tag">Understand and improve how you use AI coding tools</div>
    </div>
  </div>

  <div class="chips">
    <div class="chip">Usage dashboard</div>
    <div class="chip">MCP server · 29 read-only tools</div>
    <div class="chip">ai-usage-review skill</div>
  </div>

  <div class="foot">Runs entirely on your machine · Bun + SQLite · MIT</div>

</body>
</html>
